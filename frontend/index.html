<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionnaire de Tâches</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
    h1 { text-align: center; color: #333; }
    .form-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ddd; }
    .btn-delete { background-color: #dc3545; padding: 5px 10px; }
  </style>
</head>
<body>
  <h1>Mes Tâches</h1>
  <div class="form-group">
    <input type="text" id="todo-input" placeholder="Ajouter une nouvelle tâche...">
    <button onclick="addTodo()">Ajouter</button>
  </div>
  <ul id="todo-list"></ul>

  <script src="app.js"></script>
</body>
</html>
